name: collect

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub 스케줄은 수 분 지연될 수 있다
  workflow_dispatch:

permissions:
  contents: write

# 같은 그룹은 동시에 하나만 실행. 대기 중인 실행은 취소하지 않고 순서대로 돈다.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        run: python -m backend.collector

      - name: Commit data changes (only if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/daily
          if git diff --cached --quiet; then
            echo "데이터 변경 없음. 커밋하지 않습니다."
            exit 0
          fi
          git commit -m "log: collect data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
